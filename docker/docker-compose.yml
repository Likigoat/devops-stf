# =============================================================
# docker-compose.yml
# Proyecto: DevOps STF — Soluciones Tecnológicas del Futuro
# Descripción: Orquestación de servicios con Docker Compose
# Servicios: Flask (app), Nginx (proxy), Redis (cache)
# =============================================================

version: "3.9"

# ── Servicios ─────────────────────────────────────────────────
services:

  # ── Aplicación Flask ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: devops-stf-app
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - app_logs:/app/logs
    networks:
      - devops-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Nginx (Proxy inverso) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: devops-stf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - devops-network
    depends_on:
      - app

  # ── Redis (Cache) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devops-stf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - devops-network
    command: redis-server --appendonly yes

# ── Volúmenes persistentes ────────────────────────────────────
volumes:
  app_logs:
    driver: local
  redis_data:
    driver: local

# ── Redes personalizadas ──────────────────────────────────────
networks:
  devops-network:
    driver: bridge
    name: devops-stf-network